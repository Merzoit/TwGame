version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: twgame
      POSTGRES_USER: twgame_user
      POSTGRES_PASSWORD: twgame_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twgame_user -d twgame"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    environment:
      DEBUG: 'True'
      SECRET_KEY: 'django-insecure-dev-key-change-in-production'
      DATABASE_URL: 'postgresql://twgame_user:twgame_password@db:5432/twgame'
      REDIS_URL: 'redis://redis:6379/0'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,0.0.0.0'
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python game_app/manage.py runserver 0.0.0.0:8000

  celery:
    build: .
    environment:
      DEBUG: 'True'
      SECRET_KEY: 'django-insecure-dev-key-change-in-production'
      DATABASE_URL: 'postgresql://twgame_user:twgame_password@db:5432/twgame'
      REDIS_URL: 'redis://redis:6379/0'
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    command: celery -A game_app.twgame worker -l info

  celery-beat:
    build: .
    environment:
      DEBUG: 'True'
      SECRET_KEY: 'django-insecure-dev-key-change-in-production'
      DATABASE_URL: 'postgresql://twgame_user:twgame_password@db:5432/twgame'
      REDIS_URL: 'redis://redis:6379/0'
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    command: celery -A game_app.twgame beat -l info

volumes:
  postgres_data:
  redis_data:
  staticfiles:


