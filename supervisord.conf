[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:django]
command=/opt/venv/bin/gunicorn twgame.wsgi:application --bind 0.0.0.0:%(ENV_PORT)s --workers 1 --threads 1 --log-level info
directory=/app/game_app
environment=PYTHONPATH=/app,DJANGO_SETTINGS_MODULE=twgame.settings
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startretries=3

# Telegram bot теперь работает через webhook, не нужен постоянный процесс
